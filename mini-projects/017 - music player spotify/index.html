<html lang="en" dir="ltr">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>015</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="loading" onload="Showloading()">
    <div class="container">
      <header class="header">
        <div class="header-img">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="40"
            height="40"
            viewBox="0 0 512 512"

            />
          </svg>
        </div>
        <h3 class="header-title">Music Player</h3>
      </header>

      <audio
        src="https://dl.musicdel.ir/Music/1400/05/the_weeknd_blinding_lights%20128.mp3"
        class="audio"
      ></audio>
      <main class="main">
        <div class="card">
          <div class="card-img">
            <img
              src="https://i.scdn.co/image/ab67616d00001e028863bc11d2aa12b54f5aeb36"
              alt=""
            />
          </div>
          <div class="name-track">Blinding Lights</div>
          <div class="name-artist">The Weekend</div>
          <div class="timeline">
            <input
              type="range"
              name=""
              id="card-timeline"
              min="0"
              value="0"
              step="0.1"
            />
            <div class="time">
              <p class="all-time">3:20</p>
              <p class="time-now">0:00</p>
            </div>
          </div>
          <div class="buttons">
            <button type="button" class="btn heart">
              <img src="./images/heart-regular.webp" alt="" />
            </button>
            <button type="button" class="btn backward">
              <img src="./images/backward-step-solid.webp" alt="" />
            </button>
            <button type="button" class="btn play">
              <img src="./images/play-solid.webp" alt="" />
            </button>
            <button type="button" class="btn forward">
              <img src="./images/forward-step-solid.webp" alt="" />
            </button>
            <button type="button" class="btn qauge" title="Playback speed">
              <img src="./images/gauge-high-solid.webp" alt="" />
              <span class="speed-badge">1x</span>
            </button>
          </div>
        </div>
      </main>
    </div>

    <!-- Loader -->
    <div class="loader">
      <div class="container-loader">
        <div class="loader-shadow"></div>
      </div>
    </div>

    <!-- MR Signature Footer -->
    <footer class="mr-signature" dir="ltr" lang="en">
      <div class="mr-signature__identity">
        <img
          src="./images/Logo.webp"
          alt="logo"
          class="mr-signature__badge"
          aria-hidden="true"
        />
        <span class="mr-signature__text">
          <span class="mr-signature__name">Mohamad Reza Rajabi</span>
          <span class="mr-signature__role">— design &amp; development</span>
        </span>
      </div>
      <div class="mr-signature__links">
        <span class="mr-signature__year">© <span data-year></span></span>
        <a
          href="https://github.com/mohamadrezarajabi"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub profile"
        >
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
            />
          </svg>
          <span>GitHub</span>
        </a>
      </div>
      <script>
        document
          .querySelectorAll(".mr-signature [data-year]")
          .forEach(function (el) {
            el.textContent = new Date().getFullYear();
          });
      </script>
    </footer>

    <script src="js/Project.js"></script>
  </body>
</html>
