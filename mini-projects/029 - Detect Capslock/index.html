<!doctype html>
<html lang="na" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Count words, characters, sentences and paragraphs as you type."
    />
    <title>028</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/style/common.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="loading" onload="Showloading()">
    <!-- Loader -->
    <div class="loader">
      <div class="container-loader">
        <div class="loader-shadow"></div>
      </div>
    </div>

    <div class="container wrap">
      <main class="app">
        <header class="header">
          <div class="typing-area">
          </div>
        </header>
        <section class="keyboard">
          <div class="keyboard-brand">logitech</div>
          <div class="function-row">
            <button class="key small-key">esc</button>
            <button class="key function-key">F1</button>
            <button class="key function-key">F2</button>
            <button class="key function-key">F3</button>
            <button class="key function-key">F4</button>
            <button class="key function-key">F5</button>
            <button class="key function-key">F6</button>
            <button class="key function-key">F7</button>
            <button class="key function-key">F8</button>
            <button class="key function-key">F9</button>
            <button class="key function-key">F10</button>
            <button class="key function-key">F11</button>
            <button class="key function-key">F12</button>
          </div>
          <div class="key-row number-row">
            <button class="key">~<span>`</span></button>
            <button class="key">!<span>1</span></button>
            <button class="key">@<span>2</span></button>
            <button class="key">#<span>3</span></button>
            <button class="key">$<span>4</span></button>
            <button class="key">%<span>5</span></button>
            <button class="key">^<span>6</span></button>
            <button class="key">&amp;<span>7</span></button>
            <button class="key">*<span>8</span></button>
            <button class="key">(<span>9</span></button>
            <button class="key">)<span>0</span></button>
            <button class="key">_<span>-</span></button>
            <button class="key">+<span>=</span></button>
            <button class="key wide-key">Backspace</button>
          </div>
          <div class="key-row">
            <button class="key wide-key">Tab</button>
            <button class="key">Q</button> <button class="key">W</button>
            <button class="key">E</button> <button class="key">R</button>
            <button class="key">T</button> <button class="key">Y</button>
            <button class="key">U</button> <button class="key">I</button>
            <button class="key">O</button> <button class="key">P</button>
            <button class="key">{<span>[</span></button>
            <button class="key">}<span>]</span></button>
          </div>
          <div class="key-row">
            <button class="key caps-key" id="caps-key" type="button">
              <span>Caps Lock</span>
              <span class="caps-indicator" id="caps-indicator"></span>
            </button>
            <button class="key">A</button> <button class="key">S</button>
            <button class="key">D</button> <button class="key">F</button>
            <button class="key">G</button> <button class="key">H</button>
            <button class="key">J</button> <button class="key">K</button>
            <button class="key">L</button>
            <button class="key">:<span>;</span></button>
            <button class="key">"<span>'</span></button>
            <button class="key wide-key">Enter</button>
          </div>
          <div class="key-row">
            <button class="key wide-key">Shift</button>
            <button class="key">Z</button> <button class="key">X</button>
            <button class="key">C</button> <button class="key">V</button>
            <button class="key">B</button> <button class="key">N</button>
            <button class="key">M</button> <button class="key">&lt;</button>
            <button class="key">&gt;</button> <button class="key">?</button>
            <button class="key wide-key">Shift</button>
          </div>
          <div class="key-row bottom-row">
            <button class="key bottom-key">Ctrl</button>
            <button class="key bottom-key">Fn</button>
            <button class="key bottom-key">Alt</button>
            <button class="key space-key" aria-label="Space"></button>
            <button class="key bottom-key">Alt</button>
            <button class="key bottom-key">Ctrl</button>
          </div>
        </section>
      </main>
    </div>

    <!-- MR Signature Footer -->
    <footer class="mr-signature" dir="ltr" lang="en">
      <div class="mr-signature__identity">
        <img
          src="../../assets/images/Logo.webp"
          alt=""
          width="29"
          height="21"
          class="mr-signature__badge"
        />
        <span class="mr-signature__text">
          <span class="mr-signature__name">Mohamad Reza Rajabi</span>
          <span class="mr-signature__role">— design &amp; development</span>
        </span>
      </div>
      <div class="mr-signature__links">
        <span class="mr-signature__year">© <span data-year></span></span>
        <a
          href="https://github.com/mohamadrezarajabi"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub profile"
        >
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
            />
          </svg>
          <span>GitHub</span>
        </a>
      </div>
      <script>
        document
          .querySelectorAll(".mr-signature [data-year]")
          .forEach(function (el) {
            el.textContent = new Date().getFullYear();
          });
      </script>
    </footer>

    <script src="js/Project.js"></script>
  </body>
</html>
