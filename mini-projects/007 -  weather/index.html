<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>007</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <aside class="sidebar blur flex">
      <div class="logo">
        <a href="#"><img src="./images/Logo.PNG" width="50px" alt="" /></a>
      </div>
      <div class="navigation flex">
        <div class="nav-item weather flex">
          <span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="currentColor"
              class="bi bi-cloud-lightning-rain-fill"
              viewBox="0 0 16 16"
            >
              <path
                d="M2.658 11.026a.5.5 0 0 1 .316.632l-.5 1.5a.5.5 0 1 1-.948-.316l.5-1.5a.5.5 0 0 1 .632-.316m9.5 0a.5.5 0 0 1 .316.632l-.5 1.5a.5.5 0 0 1-.948-.316l.5-1.5a.5.5 0 0 1 .632-.316m-7.5 1.5a.5.5 0 0 1 .316.632l-.5 1.5a.5.5 0 1 1-.948-.316l.5-1.5a.5.5 0 0 1 .632-.316m9.5 0a.5.5 0 0 1 .316.632l-.5 1.5a.5.5 0 0 1-.948-.316l.5-1.5a.5.5 0 0 1 .632-.316m-7.105-1.25A.5.5 0 0 1 7.5 11h1a.5.5 0 0 1 .474.658l-.28.842H9.5a.5.5 0 0 1 .39.812l-2 2.5a.5.5 0 0 1-.875-.433L7.36 14H6.5a.5.5 0 0 1-.447-.724zm6.352-7.249a5.001 5.001 0 0 0-9.499-1.004A3.5 3.5 0 1 0 3.5 10H13a3 3 0 0 0 .405-5.973"
              ></path>
            </svg>
          </span>
          <p>آب و هوا</p>
        </div>
        <div class="nav-item cities flex">
          <span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-thermometer-snow"
              viewBox="0 0 16 16"
            >
              <path
                d="M5 12.5a1.5 1.5 0 1 1-2-1.415V9.5a.5.5 0 0 1 1 0v1.585A1.5 1.5 0 0 1 5 12.5"
              ></path>
              <path
                d="M1 2.5a2.5 2.5 0 0 1 5 0v7.55a3.5 3.5 0 1 1-5 0zM3.5 1A1.5 1.5 0 0 0 2 2.5v7.987l-.167.15a2.5 2.5 0 1 0 3.333 0L5 10.486V2.5A1.5 1.5 0 0 0 3.5 1m5 1a.5.5 0 0 1 .5.5v1.293l.646-.647a.5.5 0 0 1 .708.708L9 5.207v1.927l1.669-.963.495-1.85a.5.5 0 1 1 .966.26l-.237.882 1.12-.646a.5.5 0 0 1 .5.866l-1.12.646.884.237a.5.5 0 1 1-.26.966l-1.848-.495L9.5 8l1.669.963 1.849-.495a.5.5 0 1 1 .258.966l-.883.237 1.12.646a.5.5 0 0 1-.5.866l-1.12-.646.237.883a.5.5 0 1 1-.966.258L10.67 9.83 9 8.866v1.927l1.354 1.353a.5.5 0 0 1-.708.708L9 12.207V13.5a.5.5 0 0 1-1 0v-11a.5.5 0 0 1 .5-.5"
              ></path>
            </svg>
          </span>
          <p>شهرها</p>
        </div>
        <div class="nav-item maps flex">
          <span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-map-fill"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M16 .5a.5.5 0 0 0-.598-.49L10.5.99 5.598.01a.5.5 0 0 0-.196 0l-5 1A.5.5 0 0 0 0 1.5v14a.5.5 0 0 0 .598.49l4.902-.98 4.902.98a.5.5 0 0 0 .196 0l5-1A.5.5 0 0 0 16 14.5zM5 14.09V1.11l.5-.1.5.1v12.98l-.402-.08a.5.5 0 0 0-.196 0zm5 .8V1.91l.402.08a.5.5 0 0 0 .196 0L11 1.91v12.98l-.5.1z"
              ></path>
            </svg>
          </span>
          <p>نقشه</p>
        </div>
      </div>
      <button class="logout">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75"
          ></path>
        </svg>
      </button>
    </aside>
    <section class="weather-panel">
      <div class="search-section relative">
        <button class="search-icon absolute">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
            ></path>
          </svg>
        </button>
        <input
          type="search"
          id="search-input"
          placeholder="نام شهر را جستجو کنید"
          class="absolute blur"
        />
      </div>
      <div class="weather-card blur flex">
        <div class="weather-icon">
          <img src="./images/cloudy.png" width="220px" alt="" />
        </div>
        <div class="weather-main flex">
          <div class="status">
            <p class="weather-location">
              <span class="city">Tehran</span>,<span class="country">Iran</span>
            </p>
            <p class="weather-humidity poppins-bold">Humidity: 12%</p>
          </div>
          <div class="temperature">
            <p class="weather-description poppins-bold" dir="ltr">Temp:</p>
            <p class="weather-range poppins-bold" dir="ltr">31</p>
          </div>
        </div>
      </div>
    </section>
    <aside class="forecast-sidebar blur">
      <h3 class="forecast-title">وضعیت ۷ روز آینده:</h3>

      <div class="forecast-list">
        <div class="forecast-item">
          <span class="forecast-day">امروز (شنبه)</span>
          <span class="forecast-icon"><img src="./images/cloudy.png" width="40px" alt=""></span>
          <span class="forecast-temp"><strong>21</strong> / 34</span>
        </div>

        <div class="forecast-item">
          <span class="forecast-day">یکشنبه</span>
          <span class="forecast-icon"><img src="./images/sun.png" width="40px" alt=""></span>
          <span class="forecast-temp"><strong>5</strong> / 17</span>
        </div>

        <div class="forecast-item">
          <span class="forecast-day">دوشنبه</span>
          <span class="forecast-icon"><img src="./images/sun.png" width="40px" alt=""></span>
          <span class="forecast-temp"><strong>14</strong> / 21</span>
        </div>

        <div class="forecast-item">
          <span class="forecast-day">سه شنبه</span>
          <span class="forecast-icon"><img src="./images/sunny.png" width="40px" alt=""></span>
          <span class="forecast-temp"><strong>21</strong> / 34</span>
        </div>

        <div class="forecast-item">
          <span class="forecast-day">چهارشنبه</span>
          <span class="forecast-icon"><img src="./images/windspeed.png" width="40px" alt=""></span>
          <span class="forecast-temp"><strong>5</strong> / 17</span>
        </div>

        <div class="forecast-item">
          <span class="forecast-day">پنجشنبه</span>
          <span class="forecast-icon"><img src="./images/sun.png" width="40px" alt=""></span>
          <span class="forecast-temp"><strong>14</strong> / 21</span>
        </div>

        <div class="forecast-item">
          <span class="forecast-day">جمعه</span>
          <span class="forecast-icon"><img src="./images/cloudy.png" width="40px" alt=""></span>
          <span class="forecast-temp"><strong>14</strong> / 21</span>
        </div>

        <div class="forecast-item">
          <span class="forecast-day">شنبه</span>
          <span class="forecast-icon"><img src="./images/windspeed.png" width="40px" alt=""></span>
          <span class="forecast-temp"><strong>21</strong> / 34</span>
        </div>
      </div>
    </aside>
    <script src="js/Project.js"></script>
  </body>
</html>
