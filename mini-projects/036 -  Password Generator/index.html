<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Count words, characters, sentences and paragraphs as you type."
    />
    <title>036</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../../assets/style/common.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="container wrap">
      <main class="main">
        <section class="main-header">
          <h2>تولید رمز عبور امن</h2>
          <div class="lock">
            <svg
              width="35px"
              height="35px"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              stroke="#0000"
            >
              <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
              <g
                id="SVGRepo_tracerCarrier"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></g>
              <g id="SVGRepo_iconCarrier">
                <!-- Uploaded to: SVG Repo, www.svgrepo.com, Generator: SVG Repo Mixer Tools -->
                <path
                  opacity="0.5"
                  d="M2 16C2 13.1716 2 11.7574 2.87868 10.8787C3.75736 10 5.17157 10 8 10H16C18.8284 10 20.2426 10 21.1213 10.8787C22 11.7574 22 13.1716 22 16C22 18.8284 22 20.2426 21.1213 21.1213C20.2426 22 18.8284 22 16 22H8C5.17157 22 3.75736 22 2.87868 21.1213C2 20.2426 2 18.8284 2 16Z"
                  fill="#00c9a7"
                ></path>
                <path
                  d="M12.75 14C12.75 13.5858 12.4142 13.25 12 13.25C11.5858 13.25 11.25 13.5858 11.25 14V18C11.25 18.4142 11.5858 18.75 12 18.75C12.4142 18.75 12.75 18.4142 12.75 18V14Z"
                  fill="#00c9a7"
                ></path>
                <path
                  d="M6.75 8C6.75 5.10051 9.10051 2.75 12 2.75C14.8995 2.75 17.25 5.10051 17.25 8V10.0036C17.8174 10.0089 18.3135 10.022 18.75 10.0546V8C18.75 4.27208 15.7279 1.25 12 1.25C8.27208 1.25 5.25 4.27208 5.25 8V10.0546C5.68651 10.022 6.18264 10.0089 6.75 10.0036V8Z"
                  fill="#00c9a7"
                ></path>
              </g>
            </svg>
          </div>
        </section>
        <section class="main-main">
          <div class="main-input">
            <input
              type="text"
              readonly
              class="input-password"
              placeholder="رمز شما اینجا نمایش داده میشه"
            />
            <button type="button" class="btn-copy">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-copy preview-icon"
              >
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                <path
                  d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"
                />
              </svg>
            </button>
          </div>
          <div class="progress-password">
            <p>طول رمز عبور:</p>
            <div class="input-count">
              <input
                type="range"
                id="input-progress"
                value="8"
                min="8"
                max="32"
              />
              <label for="input-progress"><span>8</span><span>32</span></label>
            </div>
            <h3 class="count-password">10</h3>
          </div>
          <div class="password-options">
            <label class="option">
              <input type="checkbox" checked value="big" />
              <span class="checkmark"></span>
              <span class="option-content">
                <strong>حروف بزرگ</strong>
                <small>(A-Z)</small>
              </span>
            </label>

            <label class="option">
              <input type="checkbox" checked value="small" />
              <span class="checkmark"></span>
              <span class="option-content">
                <strong>حروف کوچک</strong>
                <small>(a-z)</small>
              </span>
            </label>

            <label class="option">
              <input type="checkbox" checked value="num" />
              <span class="checkmark"></span>
              <span class="option-content">
                <strong>اعداد</strong>
                <small>(0-9)</small>
              </span>
            </label>

            <label class="option">
              <input type="checkbox" value="special" />
              <span class="checkmark"></span>
              <span class="option-content">
                <strong>کاراکترهای ویژه</strong>
                <small>(!@#$...)</small>
              </span>
            </label>
          </div>
          <div class="password-strength">
            <div class="title-strength">
              <p>قدرت رمز عبور:</p>
              <h3>قوی</h3>
            </div>
            <div class="line-strength">
              <div class="line"></div>
              <div class="line"></div>
              <div class="line"></div>
              <div class="line"></div>
              <div class="line"></div>
            </div>
          </div>
          <button type="button" class="btn-submit">
            <span>تولید رمز جدید</span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-wand-sparkles preview-icon"
            >
              <path
                d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72"
              />
              <path d="m14 7 3 3" />
              <path d="M5 6v4" />
              <path d="M19 14v4" />
              <path d="M10 2v2" />
              <path d="M7 8H3" />
              <path d="M21 16h-4" />
              <path d="M11 3H9" />
            </svg>
          </button>
        </section>
      </main>
    </div>

    <!-- MR Signature Footer -->
    <footer class="mr-signature" dir="ltr" lang="en">
      <div class="mr-signature__identity">
        <img
          src="../../assets/images/Logo.webp"
          alt=""
          width="29"
          height="21"
          class="mr-signature__badge"
        />
        <span class="mr-signature__text">
          <span class="mr-signature__name">Mohamad Reza Rajabi</span>
          <span class="mr-signature__role">— design &amp; development</span>
        </span>
      </div>
      <div class="mr-signature__links">
        <span class="mr-signature__year">© <span data-year></span></span>
        <a
          href="https://github.com/mohamadrezarajabi"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub profile"
        >
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
            />
          </svg>
          <span>GitHub</span>
        </a>
      </div>
      <script>
        document
          .querySelectorAll(".mr-signature [data-year]")
          .forEach(function (el) {
            el.textContent = new Date().getFullYear();
          });
      </script>
    </footer>

    <script src="js/Project.js"></script>
    <script src="../../assets/preloader/preloader.js" defer></script>
  </body>
</html>
