<!doctype html>

<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>015</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="loading" onload="Showloading()">
    <div class="container w-full m-auto">
      <!-- ------------ Editor ------------- -->

      <div class="editor p-xl m-lg">
        <!-- Header -->

        <header class="editor-header flex">
          <button class="back-btn" type="button">←</button>

          <h1 class="editor-title">ویرایش یادداشت</h1>

          <div class="editor-header-actions flex align-center">
            <button class="save-btn" type="button">ذخیره</button>
          </div>
        </header>

        <!-- Note -->

        <main class="note-editor">
          <!-- Title + Tag -->

          <div class="note-top relative flex align-center">
            <input
              class="note-title"
              type="text"
              value="یادگیری Next.js"
              placeholder="عنوان یادداشت"
            />

            <!-- Tag selector -->

            <div class="tag-wrapper relative">
              <button
                class="tag-btn flex-center gap-md tag-purple"
                type="button"
              >
                <span class="tag-name"> برنامه‌نویسی </span>

                <span class="tag-arrow">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="m6 9 6 6 6-6" />
                  </svg>
                </span>
              </button>

              <div class="tag-menu"></div>
            </div>
          </div>

          <!-- Toolbar -->

          <div class="toolbar">
            <button type="button">
              <b>B</b>
            </button>

            <button type="button">
              <i>I</i>
            </button>

            <button type="button">☷</button>

            <button type="button">☷</button>

            <span class="toolbar-line"></span>

            <button type="button">↗</button>

            <button type="button">&lt;/&gt;</button>

            <button type="button">&lt;&gt;</button>

            <button type="button">A₂</button>
          </div>

          <!-- Content -->

          <div class="note-content" contenteditable="true" spellcheck="false">
            برای شروع پروژه‌های واقعی بهتره اول مفاهیم پایه Next.js رو کامل یاد
            بگیریم؛ مثل routing، server components و ...
          </div>

          <!-- Footer -->

          <footer class="note-footer">
            <div class="date-info">
              <span> امروز ۱۲:۴۳ </span>

              <span class="calendar-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg></span>
            </div>
          </footer>
        </main>
      </div>

      <!-- ---------------------------------- -->

      <header class="header flex-between">
        <div class="header-icon flex align-center gap-xs">
          <img
            src="./images/Logo.webp"
            width="50px"
            alt="Logo"
            class="header-icon-img"
          />

          <div class="header-icon-paragraphs">
            <p class="header-icon-p text-heading">یادداشت ها</p>

            <p class="header-icon-p text-subtitle">Notes</p>
          </div>
        </div>

        <div class="header-search flex-center relative">
          <input
            type="text"
            class="header-search-input flex align-center radius-md relative"
          />

          <svg
            class="header-search-icon__search absolute"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m21 21-4.34-4.34" />

            <circle cx="11" cy="11" r="8" />
          </svg>

          <kbd class="header-search-kbd radius-sm absolute flex-center">
            Ctrl + K
          </kbd>
        </div>

        <div class="header-login">Login</div>
      </header>

      <div class="container-hr"></div>

      <main class="main">
        <div class="main-header flex-between">
          <div class="view-toggle">
            <svg
              class="view-toggle-svg p-xs"
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 3v18" />

              <path d="M3 12h18" />

              <rect x="3" y="3" width="18" height="18" rx="2" />
            </svg>
          </div>

          <h2 class="relative">Notes</h2>

          <button class="create-tasks flex-center gap-xs">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 12h14" />

              <path d="M12 5v14" />
            </svg>

            <span> یادداشت جدید </span>
          </button>
        </div>

        <section class="card-notes">
          <ul class="notes flex-between"></ul>
        </section>
      </main>
    </div>

    <!-- ------------ Tag Modal ------------- -->

    <div class="modal-overlay" id="tagModal">
      <div class="tag-modal">
        <div class="modal-header">
          <h2>مدیریت تگ‌ها</h2>

          <button class="modal-close" type="button">×</button>
        </div>

        <!-- Add Tag -->

        <div class="add-tag">
          <input
            class="new-tag-input"
            type="text"
            placeholder="نام تگ جدید..."
          />

          <input class="new-tag-color" type="color" value="#8b5cf6" />

          <button class="add-tag-btn" type="button">افزودن</button>
        </div>

        <!-- Tags -->

        <div class="tags-list"></div>
      </div>
    </div>

    <!-- Loader -->

    <div class="loader">
      <!-- From Uiverse.io by alexruix -->

      <div class="container-loader">
        <div class="loader-shadow"></div>
      </div>
    </div>
    <div class="modal-overlay" id="tagModal">

  <div class="tag-modal">

    <div class="modal-header">

      <h2>مدیریت تگ‌ها</h2>

      <button
        class="modal-close"
        type="button"
      >
        ×
      </button>

    </div>


    <!-- Add tag -->

    <div class="add-tag">

      <input
        class="new-tag-input"
        type="text"
        placeholder="نام تگ جدید..."
      >

      <input
        class="new-tag-color"
        type="color"
        value="#8b5cf6"
      >

      <button
        class="add-tag-btn"
        type="button"
      >
        افزودن
      </button>

    </div>

  </div>
    <script src="js/Project.js"></script>
  </body>
</html>
