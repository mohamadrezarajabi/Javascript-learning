<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Count words, characters, sentences and paragraphs as you type."
    />
    <title>036</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="preload"
      as="image"
      href="../../assets/images/Logo.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="../../assets/preloader/preloader.css" />
    <link rel="stylesheet" href="../../assets/style/common.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div
      class="preloader"
      id="preloader"
      role="status"
      aria-live="polite"
      style="
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        overflow: hidden;
      "
    >
      <span class="visually-hidden">Loading</span>
      <div
        class="preloader__logo"
        style="
          display: grid;
          width: min(clamp(180px, 26vw, 340px), 60vh);
          max-width: calc(100vw - 48px);
        "
      >
        <img
          class="preloader__layer preloader__layer--m"
          src="../../assets/images/Logo.webp"
          alt=""
          width="1536"
          height="1024"
          fetchpriority="high"
          decoding="async"
          style="
            grid-area: 1 / 1;
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
          "
        />
        <img
          class="preloader__layer preloader__layer--r"
          src="../../assets/images/Logo.webp"
          alt=""
          width="1536"
          height="1024"
          fetchpriority="high"
          decoding="async"
          style="
            grid-area: 1 / 1;
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
          "
        />
        <img
          class="preloader__layer preloader__layer--shine"
          src="../../assets/images/Logo.webp"
          alt=""
          width="1536"
          height="1024"
          fetchpriority="high"
          decoding="async"
          aria-hidden="true"
          style="
            grid-area: 1 / 1;
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
          "
        />
      </div>
    </div>

    <div class="container wrap">
      <main class="login-page">
        <section class="welcome-section">
          <div class="welcome-content">
            <h1>Welcome <span>Back!</span></h1>

            <p>
              Access your account to continue
              <br />
              with your journey.
            </p>
          </div>

          <div class="workspace-image">
            <img
              src="./images/image.png"
              alt="Laptop with code, a green plant and a coffee mug"
            />
          </div>
        </section>

        <section class="login-section">
          <div class="login-card">
            <h2>Sign In</h2>
            <p class="login-description">Enter your credentials to login</p>

            <form class="login-form">
              <div class="input-group">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>

                <input
                  type="text"
                  name="username"
                  placeholder="Username"
                  autocomplete="username"
                />
              </div>

              <div class="input-group">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="11" width="18" height="11" rx="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                  <circle cx="12" cy="16" r="1" />
                </svg>

                <input
                  type="password"
                  name="password"
                  placeholder="Password"
                  autocomplete="current-password"
                />

                <button
                  class="password-toggle"
                  type="button"
                  aria-label="Show password"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                    <path
                      d="M9.9 5.2A10.8 10.8 0 0 1 12 5c5 0 8.3 4.5 9 7-.3 1.1-1.2 2.5-2.5 3.7M6.2 6.2C3.8 7.7 2.3 10 2 12c.7 2.5 4 7 10 7 1.1 0 2.1-.2 3-.5"
                    />
                  </svg>
                </button>
              </div>

              <div class="form-options">
                <label class="remember-option">
                  <input type="checkbox" name="remember" />
                  <span>Remember me</span>
                </label>

                <a href="#">Forgot password?</a>
              </div>

              <button class="sign-in-button" type="submit">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 12h14M13 6l6 6-6 6" />
                </svg>
                Sign In
              </button>
            </form>

            <div class="login-divider">
              <span></span>
              <p>or</p>
              <span></span>
            </div>

            <a href="#" class="github-button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 .9a11.1 11.1 0 0 0-3.5 21.6c.6.1.8-.3.8-.6v-2.1c-3.1.7-3.8-1.3-3.8-1.3-.5-1.3-1.2-1.6-1.2-1.6-1-.7.1-.7.1-.7 1.1.1 1.7 1.1 1.7 1.1 1 .1.8 2.2 3.2 1.6.1-.7.4-1.2.7-1.5-2.5-.3-5.1-1.3-5.1-5.5 0-1.2.4-2.2 1.1-3-.1-.3-.5-1.4.1-2.9 0 0 .9-.3 3 1.1a10.4 10.4 0 0 1 5.5 0c2.1-1.4 3-1.1 3-1.1.6 1.5.2 2.6.1 2.9.7.8 1.1 1.8 1.1 3 0 4.2-2.6 5.2-5.1 5.5.4.3.8 1 .8 2v2.5c0 .3.2.7.8.6A11.1 11.1 0 0 0 12 .9Z"
                />
              </svg>
              Continue with GitHub
            </a>

            <p class="register-text">
              Don't have an account?
              <a href="mailto:contact@mohamadrezarajabi.ir">Contact me</a>
            </p>
          </div>
        </section>
      </main>
    </div>

    <!-- MR Signature Footer -->
    <footer class="mr-signature" dir="ltr" lang="en">
      <div class="mr-signature__identity">
        <img
          src="../../assets/images/Logo.webp"
          alt=""
          width="29"
          height="21"
          class="mr-signature__badge"
        />
        <span class="mr-signature__text">
          <span class="mr-signature__name">Mohamad Reza Rajabi</span>
          <span class="mr-signature__role">— design &amp; development</span>
        </span>
      </div>
      <div class="mr-signature__links">
        <span class="mr-signature__year">© <span data-year></span></span>
        <a
          href="https://github.com/mohamadrezarajabi"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub profile"
        >
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
            />
          </svg>
          <span>GitHub</span>
        </a>
      </div>
      <script>
        document
          .querySelectorAll(".mr-signature [data-year]")
          .forEach(function (el) {
            el.textContent = new Date().getFullYear();
          });
      </script>
    </footer>

    <script src="js/Project.js"></script>
    <script src="../../assets/preloader/preloader.js" defer></script>
  </body>
</html>
