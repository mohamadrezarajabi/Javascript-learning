<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>011</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="contextmenu hidden">
      <header class="header-icons">
        <div class="header-icon">
          <img class="icon-svg" src="./images/scissors.svg" alt="" />
        </div>
        <div class="header-icon__hr"></div>
        <div class="header-icon">
          <img class="icon-svg" src="./images/copy.svg" alt="" />
        </div>
        <div class="header-icon__hr"></div>
        <div class="header-icon">
          <img class="icon-svg" src="./images/clipboard-paste.svg" alt="" />
        </div>
        <div class="header-icon__hr"></div>
        <div class="header-icon">
          <img class="icon-svg" src="./images/trash.svg" alt="" />
        </div>
        <div class="header-icon__hr"></div>
        <div class="header-icon">
          <img class="icon-svg" src="./images/share-2.svg" alt="" />
        </div>
      </header>
      <main class="main-items">
        <div class="main-item">
          <div class="main-item__icon">
            <img
              class="icon-svg"
              src="./images/square-arrow-out-up-right.svg"
              alt=""/>
            <span class="main-item__title">بازکردن</span>
          </div>
          <kbd class="main-item__icon_left">Enter</kbd>
        </div>
        <div class="main-item">
          <div class="main-item__icon">
            <img class="icon-svg" src="./images/folder-open.svg" alt="" />
            <span class="main-item__title">بازکردن در...</span>
          </div>
          <svg class="svg-left" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left"><path d="m15 18-6-6 6-6"/></svg>
        </div>
        <div class="main-icon__hr"></div>
        <div class="main-item">
          <div class="main-item__icon">
            <img class="icon-svg" src="./images/square-terminal.svg" alt="" />
            <span class="main-item__title" >اجرای ترمینال</span>
          </div>
          <kbd class="main-item__icon_left">Ctrl + T</kbd>
        </div>
        <div class="main-icon__hr"></div>
        <div class="main-item">
          <div class="main-item__icon">
            <img class="icon-svg" src="./images/wrench.svg" alt="" />
            <span class="main-item__title" >مشخصات</span>
          </div>
        </div>
        <div class="main-icon__hr"></div>
        <div class="main-item">
          <div class="main-item__icon">
            <img class="icon-svg" src="./images/send.svg" alt=""/>
            <span class="main-item__title">ارسال با</span>
          </div>
          <kbd class="main-item__icon_left">Ctrl + Shift + S</kbd>

        </div>
        <div class="main-icon__hr"></div>
        <div class="main-item">
          <div class="main-item__icon">
            <img class="icon-svg" src="./images/zap.svg" alt="" />
            <span >دسترسی سریع</span>
          </div>
          <a class="main-item__link" href="#">
            <svg class="svg-left" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-link"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            <span>t.me/Rezaalog</span>
          </a>
        </div>
      </main>
    </div>
    <!-- MR Signature Footer -->
    <footer class="mr-signature" dir="ltr" lang="en">
      <div class="mr-signature__identity">
        <img
          src="./images/Logo.webp"
          alt="logo"
          class="mr-signature__badge"
          aria-hidden="true"
        />
        <span class="mr-signature__text">
          <span class="mr-signature__name">Mohamad Reza Rajabi</span>
          <span class="mr-signature__role">— design &amp; development</span>
        </span>
      </div>
      <div class="mr-signature__links">
        <span class="mr-signature__year">© <span data-year></span></span>
        <a
          href="https://github.com/mohamadrezarajabi"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub profile"
        >
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
            />
          </svg>
          <span>GitHub</span>
        </a>
      </div>
      <script>
        document
          .querySelectorAll(".mr-signature [data-year]")
          .forEach(function (el) {
            el.textContent = new Date().getFullYear();
          });
      </script>
    </footer>

    <script src="js/Project.js"></script>
  </body>
</html>
