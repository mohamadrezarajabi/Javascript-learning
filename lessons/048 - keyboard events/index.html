<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="form-card">
      <div class="field">
        <label for="username">Username</label>
        <input
          type="text"
          class="username"
          id="username"
          placeholder="Enter username"
        />
        <span class="hint" id="usernameHint">3-15 characters</span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          class="password"
          id="password"
          placeholder="Enter password"
        />
        <span class="hint" id="passwordHint">Strength: -</span>
      </div>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
