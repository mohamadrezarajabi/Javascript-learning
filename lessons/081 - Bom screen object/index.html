<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      rel="preload"
      as="image"
      href="../../assets/images/Logo.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="../../assets/preloader/preloader.css" />
    <link rel="stylesheet" href="../../assets/style/common.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div
      class="preloader"
      id="preloader"
      role="status"
      aria-live="polite"
      style="
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        overflow: hidden;
      "
    >
      <span class="visually-hidden">Loading</span>
      <div
        class="preloader__logo"
        style="
          display: grid;
          width: min(clamp(180px, 26vw, 340px), 60vh);
          max-width: calc(100vw - 48px);
        "
      >
        <img
          class="preloader__layer preloader__layer--m"
          src="../../assets/images/Logo.webp"
          alt=""
          width="1536"
          height="1024"
          fetchpriority="high"
          decoding="async"
          style="
            grid-area: 1 / 1;
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
          "
        />
        <img
          class="preloader__layer preloader__layer--r"
          src="../../assets/images/Logo.webp"
          alt=""
          width="1536"
          height="1024"
          fetchpriority="high"
          decoding="async"
          style="
            grid-area: 1 / 1;
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
          "
        />
        <img
          class="preloader__layer preloader__layer--shine"
          src="../../assets/images/Logo.webp"
          alt=""
          width="1536"
          height="1024"
          fetchpriority="high"
          decoding="async"
          aria-hidden="true"
          style="
            grid-area: 1 / 1;
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
          "
        />
      </div>
    </div>

    <div class="page">
      <div class="wrap">
        <div class="screen-card">
          <div class="card-header">
            <h2>Screen Information</h2>
            <p>Display details of your device</p>
          </div>

          <div class="screen-info">
            <div class="info-item">
              <span>Screen Width</span>
              <strong id="screen-width">-</strong>
            </div>

            <div class="info-item">
              <span>Screen Height</span>
              <strong id="screen-height">-</strong>
            </div>

            <div class="info-item">
              <span>Available Width</span>
              <strong id="available-width">-</strong>
            </div>

            <div class="info-item">
              <span>Available Height</span>
              <strong id="available-height">-</strong>
            </div>

            <div class="info-item">
              <span>Color Depth</span>
              <strong id="color-depth">-</strong>
            </div>

            <div class="info-item">
              <span>Pixel Depth</span>
              <strong id="pixel-depth">-</strong>
            </div>
          </div>

          <div class="viewport-info">
            <h3>Browser Window</h3>

            <div class="info-item">
              <span>Window Width</span>
              <strong id="window-width">-</strong>
            </div>

            <div class="info-item">
              <span>Window Height</span>
              <strong id="window-height">-</strong>
            </div>
          </div>

          <p class="status" id="status">Information loaded.</p>
        </div>
      </div>
    </div>

    <!-- MR Signature Footer -->
    <footer class="mr-signature" dir="ltr" lang="en">
      <div class="mr-signature__identity">
        <img
          src="../../assets/images/Logo.webp"
          alt="logo"
          class="mr-signature__badge"
          aria-hidden="true"
        />
        <span class="mr-signature__text">
          <span class="mr-signature__name">Mohamad Reza Rajabi</span>
          <span class="mr-signature__role">— design &amp; development</span>
        </span>
      </div>
      <div class="mr-signature__links">
        <span class="mr-signature__year">© <span data-year></span></span>
        <a
          href="https://github.com/mohamadrezarajabi"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub profile"
        >
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
            />
          </svg>
          <span>GitHub</span>
        </a>
      </div>
      <script>
        document
          .querySelectorAll(".mr-signature [data-year]")
          .forEach(function (el) {
            el.textContent = new Date().getFullYear();
          });
      </script>
    </footer>
    <script src="js/app.js"></script>
    <script src="../../assets/preloader/preloader.js" defer></script>
  </body>
</html>
