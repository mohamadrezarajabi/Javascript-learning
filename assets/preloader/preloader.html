<div class="preloader" id="preloader" role="status" aria-live="polite">
  <span class="visually-hidden">Loading</span>
  <div class="preloader__logo">
    <img
      class="preloader__layer preloader__layer--m"
      src="../images/Logo.webp"
      alt=""
      width="1536"
      height="1024"
      decoding="async"
    />
    <img
      class="preloader__layer preloader__layer--r"
      src="../images/Logo.webp"
      alt=""
      width="1536"
      height="1024"
      decoding="async"
    />
    <img
      class="preloader__layer preloader__layer--shine"
      src="../images/Logo.webp"
      alt=""
      width="1536"
      height="1024"
      decoding="async"
      aria-hidden="true"
    />
  </div>
</div>
